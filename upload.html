<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Detect Field Report Receipt</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h2, h3 {
            color: #1a365d;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #cbd5e1;
        }
        label {
            font-weight: 600;
            font-size: 14px;
        }
        input[type="file"], button {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .receipt-card {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }
        .receipt-header {
            text-align: center;
            border-bottom: 2px dashed #fcd34d;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .receipt-body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #1e293b;
        }
        .receipt-body ul {
            padding-left: 20px;
            margin: 5px 0;
        }
        .receipt-body strong {
            color: #0f172a;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Field Service Report Portal</h2>
    <p style="text-align: center; color: #64748b; font-size: 13px;">Upload a report—the AI will automatically detect the client category.</p>
    
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <label for="report_image">Upload Report Image:</label>
        <input type="file" name="report_image" id="report_image" required>

        <button type="submit">Auto-Detect & Generate Receipt</button>
    </form>

    {% if extracted_data %}
    <div class="receipt-card">
        <div class="receipt-header">
            <h3>📋 Field Service Report Receipt</h3>
            <p style="margin: 0; font-size: 13px; color: #64748b;">Status: <strong>Auto-Categorized</strong></p>
        </div>
        <div class="receipt-body">
            {{ extracted_data | safe }}
        </div>
        <a href="/" class="back-link">← Upload Another Report</a>
    </div>
    {% endif %}
</div>

</body>
</html>
